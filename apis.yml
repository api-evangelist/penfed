name: PenFed Credit Union
kind: company
description: >-
  PenFed Credit Union (Pentagon Federal Credit Union), founded in 1935 and
  headquartered in McLean, Virginia, is a federally chartered credit union
  regulated by the National Credit Union Administration (NCUA) and one of the
  largest credit unions in the United States, with roughly 2.9 million members
  and tens of billions of dollars in assets. It is a not-for-profit, member-owned
  financial cooperative that originally served the U.S. military and defense
  community and now offers open membership, providing mortgages, auto loans,
  credit cards, personal loans, and deposit accounts. On the open-finance front,
  PenFed runs an internal API-management practice — MuleSoft/Anypoint is the
  backbone of its digital-banking platform and an Apigee-backed developer portal
  host exists at developer.penfed.org (with an api.penfed.org gateway) — but
  neither surface is publicly documented or openly reachable: there is no public
  developer program, no published OpenAPI, and consumer account data is made
  available to members through permissioned third-party aggregators such as Plaid
  rather than a directly documented FDX or CFPB Section 1033 data-access API.
